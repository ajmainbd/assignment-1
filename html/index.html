<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Box 1</h2>

    <div class="Box">

         <div class="top">
            <div class="left"></div>
            <div class="right"></div>
         </div>
         <div class="bottom">
            <div class="left"></div>
            <div class="right"></div>
         </div>
    </div>

   
    <h2>Box 2</h2>
    <div class="Box-2">
        <div class="top-1">
            <div class="top-left"></div>
            <div class="top-right"></div>
        </div>
        <div class="bottom-1">
        <div class="bottom-left">
             <div class="left-1"></div>
            <div class="left-2"></div>
        </div>
        <div class="bottom-right"></div>
        </div>
    </div>


    <h2>Box 5</h2>
    <div class="Box-5">
        <div class="small-box"></div>
    </div>

    <h2>Box 3</h2>

    <div class="box-3">
         <div class="row-1">
            <div class="col-1"></div>
            <div class="col-2"></div>
            <div class="col-3"></div>
        </div>
        <div class="row-2">
        <div class="col-1">
             <div class="el-a"></div>
            <div class="el-b"></div>
        </div>
        <div class="col-2">
            <div class="el-a"></div>
            <div class="el-b"></div>
        </div>
        </div>
    </div>

    <h2>box 5</h2>
    <div class="box-5">
        <div class="row1">
        <div class="col-1"></div>
        <div class="col-2">
            <div class="circle"></div>
        </div>
        <div class="col-3"></div>
        </div>

        <div class="row2">
            <div class="col-1">
               <div class="circle-small"></div>
            </div>
            <div class="col-2">
                <div class="circle-big"></div>
            </div>
            <div class="col-3">
                <div class="circle-small"></div>
            </div>
        </div>

           <div class="row3">
        <div class="col-1"></div>
        <div class="col-2">
            <div class="circle"></div>
        </div>
        <div class="col-3"></div>
        </div>
    </div>

</body>
</html>
